<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PCU Registration Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background-overlay"></div>

    <div class="container main-container">

        <div class="form-card">

            <!-- Header -->
            <div class="form-header">

                <div class="pcu-logo">
                    PCU
                </div>

                <h1>Pimpri Chinchwad University</h1>

                <p>Student Registration Form</p>

            </div>


            <!-- Form -->
            <form id="registrationForm">

                <div class="row">

                    <!-- Full Name -->
                    <div class="col-md-6 form-group">
                        <label>Full Name</label>

                        <input type="text"
                               id="name"
                               class="form-control"
                               placeholder="Enter your full name">

                        <small id="nameError"
                               class="error"></small>
                    </div>


                    <!-- Email -->
                    <div class="col-md-6 form-group">
                        <label>Email Address</label>

                        <input type="email"
                               id="email"
                               class="form-control"
                               placeholder="Enter your email">

                        <small id="emailError"
                               class="error"></small>
                    </div>


                    <!-- Mobile -->
                    <div class="col-md-6 form-group">
                        <label>Mobile Number</label>

                        <input type="text"
                               id="mobile"
                               class="form-control"
                               placeholder="10 digit mobile number">

                        <small id="mobileError"
                               class="error"></small>
                    </div>


                    <!-- Age -->
                    <div class="col-md-6 form-group">
                        <label>Age</label>

                        <input type="number"
                               id="age"
                               class="form-control"
                               placeholder="Enter your age">

                        <small id="ageError"
                               class="error"></small>
                    </div>


                    <!-- Gender -->
                    <div class="col-md-6 form-group">

                        <label>Gender</label>

                        <div class="gender-box">

                            <label>
                                <input type="radio"
                                       name="gender"
                                       value="Male">

                                Male
                            </label>

                            <label>
                                <input type="radio"
                                       name="gender"
                                       value="Female">

                                Female
                            </label>

                        </div>

                        <small id="genderError"
                               class="error"></small>

                    </div>


                    <!-- Password -->
                    <div class="col-md-6 form-group">

                        <label>Password</label>

                        <div class="password-box">

                            <input type="password"
                                   id="password"
                                   class="form-control"
                                   placeholder="Create password">

                            <button type="button"
                                    id="togglePassword">

                                Show

                            </button>

                        </div>

                        <div class="strength">

                            <div id="strengthBar"></div>

                        </div>

                        <small id="strengthText">
                            Password strength
                        </small>

                        <small id="passwordError"
                               class="error"></small>

                    </div>


                    <!-- Confirm Password -->
                    <div class="col-12 form-group">

                        <label>Confirm Password</label>

                        <input type="password"
                               id="confirmPassword"
                               class="form-control"
                               placeholder="Re-enter password">

                        <small id="confirmPasswordError"
                               class="error"></small>

                    </div>


                    <!-- Terms -->
                    <div class="col-12 terms-area">

                        <label>

                            <input type="checkbox"
                                   id="terms">

                            I agree to the Terms & Conditions

                        </label>

                        <small id="termsError"
                               class="error"></small>

                    </div>

                </div>


                <!-- Submit -->
                <button type="submit"
                        class="register-btn">

                    Create Student Account

                </button>


                <!-- Success -->
                <div id="successMessage"
                     class="success-message">

                    Registration successful! Welcome to PCU.

                </div>

            </form>


            <div class="footer">
                © 2026 Pimpri Chinchwad University
            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
